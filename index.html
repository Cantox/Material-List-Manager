<html>

<head>
    <title>Litematica Material List Manager</title>
    <meta charset="UTF-8">
    <meta name="author" content="Cantoni Alessandro">
    <meta name="description" content="Webapp to view and manage litematica material lists">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inconsolata">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <script src="./script.js"></script>
    
    <input type="file" id="fileInput">
    <button onclick="openList()">apri</button> <br><br>

    <input type="file" id="fileInputOriginalList">
    <button onclick="convertList()">converti</button> <br><br>

    <table id="listTable">
        <tr>
            <th>BLOCK</th>
            <th>AMOUNT</th>
            <th>COMPLETED</th>
            <th>HIDE</th>
            <th>NOTES</th>
        </tr>
    </table>

    <details>
        <summary>HIDDEN ITEMS</summary>
        <table id="hiddenTable">
            <tr>
                <th>BLOCK</th>
                <th>AMOUNT</th>
                <th>COMPLETED</th>
                <th>HIDE</th>
                <th>NOTES</th>
            </tr>
        </table>
    </details>

</body>
