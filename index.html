<html>

<head>
    <title>Litematica Material List Manager</title>
    <meta charset="UTF-8">
    <meta name="author" content="Cantoni Alessandro">
    <meta name="description" content="Webapp to view and manage litematica material lists">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inconsolata">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1>LITEMATICA MATERIAL LIST MANAGER</h1>
    
<div class="header_div">
    <div style="margin-bottom: 15px;">
        <label>Pick a list to view:</label><br>
        <input type="file" id="fileInput">
        <button onclick="openList()">Open</button>
    </div>

    <div>
        <label>Pick a list to convert:</label><br>
        <input type="file" id="fileInputOriginalList">
        <button onclick="convertList()">Convert</button><br>
    </div>
</div>

<hr>

<div class="table_div">
    <h2 id="listNameLabel"></h2>

    <!-- Items Table -->
    <table id="listTable">
        <thead>
        <tr>
            <th>BLOCK</th>
            <th>AMOUNT</th>
            <th>COMPLETED</th>
            <th>HIDE</th>
            <th>NOTES</th>
        </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <!-- Hidden Items Table -->
    <details>
        <summary>HIDDEN ITEMS</summary>
        <table id="hiddenTable">
            <thead>
            <tr>
                <th>BLOCK</th>
                <th>AMOUNT</th>
                <th>COMPLETED</th>
                <th>HIDE</th>
                <th>NOTES</th>
            </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>
    </details>
</div>

<hr>

<div style="min-width: 100%; text-align: center;">
    <button class="custom_button save" onclick="saveList()">Save</button>
    <button class="custom_button clear" onclick="clearSite()">Clear</button>
</div>

<script src="./script.js"></script>
</body>
