<html>

<head>
    <title>Litematica Material List Manager</title>
    <meta charset="UTF-8">
    <meta name="author" content="Cantoni Alessandro">
    <meta name="description" content="Webapp to view and manage litematica material lists">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inconsolata">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./Assets/Textures/rc-minecraft-64.css">
</head>

<body>
<div class="title_wrapper">
    <h1>LITEMATICA MATERIAL LIST MANAGER</h1>
    <div style="min-width: 100%;">
    <button class="custom_button" onclick="toggleTheme()">Theme Switch</button>

    <span class="dropdown_wrapper">
        <button class="custom_button" onclick="toggleSort()">Block Sorting</button>

        <div id="sortPanel" class="dropdown_panel">
            <button class="sort_option" onclick="sortItems('category')">Category</button><br>
            <button class="sort_option" onclick="sortItems('id')">Name (A-Z)</button><br>
            <button class="sort_option" onclick="sortItems('idReversed')">Name (Z-A)</button><br>
            <button class="sort_option" onclick="sortItems('amount')">Amount ↓</button><br>
            <button class="sort_option" onclick="sortItems('amountReversed')">Amount ↑</button><br>
            <button class="sort_option" onclick="sortItems('completed')">Completed ↓</button><br>
            <button class="sort_option" onclick="sortItems('completedReversed')" style="margin-bottom: 0 !important;">Completed ↑</button>
        </div>
    </span>
        
    <span class="dropdown_wrapper">
        <button class="custom_button" onclick="toggleCalc()">Calculator</button>

        <div id="calcPanel" class="dropdown_panel">
            <input type="text" id="calcInput" placeholder="es. (3+4)*2">
            <div id="calcRes" class="result_div">= ??</div>
        </div>
    </span>
    </div>
</div>

<hr class="thick_hr">
    
<div class="header_div">
    <div style="margin-bottom: 15px;">
        <label>Pick a list to view:</label><br>
        <input type="file" id="fileInput">
        <button onclick="openList()">Open</button>
    </div>

    <div>
        <label>Pick a list to convert:</label><br>
        <input type="file" id="fileInputOriginalList">
        <button onclick="convertList()">Convert</button><br>
    </div>
</div>

<hr>

<div class="table_div">
    <h2 id="listNameLabel"></h2>

    <!-- Items Table -->
    <table id="listTable">
        <thead>
        <tr>
            <th>BLOCK</th>
            <th>AMOUNT</th>
            <th>COMPLETED</th>
            <th>HIDE</th>
            <th>NOTES</th>
        </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <!-- Hidden Items Table -->
    <details>
        <summary>HIDDEN ITEMS</summary>
        <table id="hiddenTable">
            <thead>
            <tr>
                <th>BLOCK</th>
                <th>AMOUNT</th>
                <th>COMPLETED</th>
                <th>HIDE</th>
                <th>NOTES</th>
            </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>
    </details>
</div>

<hr>

<div style="min-width: 100%; text-align: center;">
    <button class="custom_button save" onclick="saveList()">Save</button>
    <button class="custom_button clear" onclick="clearSite()">Clear</button>
</div>

<script src="./index.js"></script>
<script src="./scripts/list.js"></script>
<script src="./scripts/fileUtils.js"></script>
</body>
